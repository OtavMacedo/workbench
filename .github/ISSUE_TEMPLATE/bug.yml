name: Bug report
description: A reproducible problem with a synthetic example.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Never include real keys, private identities, passphrases or decrypted backups.
        Report vulnerabilities privately through the Security tab.
  - type: input
    id: version
    attributes:
      label: Workbench version
      description: Output of wkb version.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and architecture
      placeholder: macOS arm64 or Linux amd64
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use fake values and a separate vault. Include commands and the expected result.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Redact sensitive data before attaching output or screenshots.
    validations:
      required: true
