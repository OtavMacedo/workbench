name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check formatting and dependencies
        run: |
          test -z "$(gofmt -l cmd internal skills)"
          go mod verify
          node --check internal/ui/web/app.js
      - name: Vet and test with the race detector
        env:
          WORKBENCH_TEST_KERNEL_KEYRING: "1"
        run: |
          go vet ./...
          go test -race -cover ./...
      - name: Build and exercise the installed CLI
        run: |
          go build -trimpath -o "$RUNNER_TEMP/wkb" ./cmd/workbench
          python3 scripts/smoke.py "$RUNNER_TEMP/wkb"
  security:
    name: Vulnerability check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
